/* 无需 root 的用户态网络；远程镜像需要宿主机能访问外网。 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "https://bellard.org/jslinux/bbl64.bin",
    kernel: "https://bellard.org/jslinux/kernel-riscv64.bin",
    cmdline: "loglevel=3 swiotlb=1 console=hvc0 root=root rootfstype=9p rootflags=trans=virtio ro",
    fs0: { file: "https://vfsync.org/u/os/buildroot-riscv64" },
    eth0: { driver: "user" },
}

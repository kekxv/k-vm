name: Linux builds and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  host-compatibility:
    name: Host compatibility checks
    uses: ./.github/workflows/host-compatibility.yml

  build:
    name: Linux packages (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-linux-packages
          repository-cache: true
      - name: Install guest fixture tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs binutils
      - name: Test release automation
        run: |
          python3 tools/ci_run.py -- python3 tests/release_version_test.py
          python3 tools/ci_run.py -- python3 tests/publish_release_test.py
      - name: Build and test portable runtime
        run: |
          python3 tools/ci_run.py --bazel -- bazel test --config=linux-amd64-musl \
            //:k-vm //tests:network_test //tests:confined_fs_test \
            //tests:block_file_test //tests:image_update_test //tests:workspace_test \
            //tests:portable_confined_fs_test //tests:portable_image_update_test \
            //tests:portable_workspace_test //tests:sandbox_test //tests:pi_install_test //tests:initialize_test
      - name: Cross-build, validate ELF ABI and package all variants
        run: |
          # Package immediately: bazel-bin follows the most recent configuration.
          # Finish with amd64/musl for the guest checks below.
          for arch in arm64 amd64; do
            for libc in glibc musl; do
              python3 tools/ci_run.py --bazel -- bazel build --config=linux-$arch-$libc //:k-vm
              python3 tools/ci_run.py -- python3 tools/package_linux.py --arch "$arch" --libc "$libc" --glibc 2.28
            done
          done
      - name: Prepare reference guest
        run: python3 tools/ci_run.py -- python3 tools/prepare_linux_image.py --output images/ci-riscv64
      - name: Guest mappings, networking, command interruption and updates
        run: |
          python3 tools/ci_run.py -- python3 tests/agent_workspace_check.py --image images/ci-riscv64
          python3 tools/ci_run.py -- python3 tests/linux_sandbox_check.py --image images/ci-riscv64
          python3 tools/ci_run.py -- python3 tests/pi_update_check.py --image images/ci-riscv64
          python3 tools/ci_run.py -- python3 tests/pi_init_check.py --image images/ci-riscv64
          python3 tools/ci_run.py -- python3 tests/agent_dispatch_check.py --image images/ci-riscv64
      - uses: actions/upload-artifact@v4
        with:
          name: k-vm-linux
          path: dist/*
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-linux-build
          path: ${{ runner.temp }}/k-vm-ci-logs/
          if-no-files-found: ignore

  base-image:
    name: RISC-V base image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-base-image
          repository-cache: true
      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
            device-tree-compiler e2fsprogs make bc bison flex libssl-dev libelf-dev xz-utils
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Identify boot component cache
        id: boot-cache-key
        run: |
          key=$(python3 tools/ci_run.py -- python3 tools/prepare_agent_image.py --print-boot-cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Cache Linux and OpenSBI binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/k-vm-riscv-build/boot
          key: k-vm-boot-${{ runner.os }}-${{ steps.boot-cache-key.outputs.key }}
          restore-keys: |
            k-vm-boot-${{ runner.os }}-
      - name: Test image preparation and packaging
        run: |
          python3 tools/ci_run.py -- python3 tools/agent_image/test_prepare.py
          python3 tools/ci_run.py -- python3 tests/pi_install_test.py
          python3 tools/ci_run.py -- python3 tests/package_image_test.py
      - name: Build portable emulator
        run: python3 tools/ci_run.py --bazel -- bazel build --config=linux-amd64-musl //:k-vm
      - name: Build base image without Node.js or Pi
        # Extract as root to preserve guest Unix ownership inside the ext4 disk.
        run: python3 tools/ci_run.py -- sudo python3 tools/prepare_agent_image.py --output images/base-riscv64 --build-cache "$RUNNER_TEMP/k-vm-riscv-build"
      - name: Check base guest workspace and command interruption
        run: python3 tools/ci_run.py -- python3 tests/agent_workspace_check.py --image images/base-riscv64
      - name: Package sparse image and verify checksum
        run: |
          python3 tools/ci_run.py -- python3 tools/package_image.py --image images/base-riscv64
          cd dist
          python3 ../tools/ci_run.py -- sha256sum --check k-vm-base-riscv64.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: k-vm-base-riscv64
          path: |
            dist/k-vm-base-riscv64.tar.xz
            dist/k-vm-base-riscv64.tar.xz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-base-image
          path: ${{ runner.temp }}/k-vm-ci-logs/
          if-no-files-found: ignore

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: [build, base-image, host-compatibility]
    concurrency:
      group: k-vm-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select release tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            tag="$RELEASE_REF_NAME"
            publish=true
          else
            tag=$(python3 tools/ci_run.py -- python3 tools/release_version.py)
            # An authentication/network error fails the step; it is not a missing tag.
            existing=$(python3 tools/ci_run.py -- git ls-remote --tags origin "refs/tags/$tag")
            if [[ -n "$existing" ]]; then
              publish=false
              echo "### Release skipped: $tag already exists" >> "$GITHUB_STEP_SUMMARY"
            else
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: k-vm-*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        if: steps.version.outputs.publish == 'true'
        run: |
          cd dist
          python3 ../tools/ci_run.py -- sha256sum --check *.sha256
      - name: Publish version release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 tools/ci_run.py -- bash tools/publish_release.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-release
          path: ${{ runner.temp }}/k-vm-ci-logs/
          if-no-files-found: ignore

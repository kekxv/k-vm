name: Host compatibility
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: python3 tools/ci_run.py -- python3 tools/prepare_linux_image.py --output images/ci-riscv64
      - run: python3 tools/ci_run.py -- python3 tests/win32_update_check.py --image images/ci-riscv64 --prepare images/ci-update-riscv64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-riscv64-fixture
          path: images/ci-riscv64/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update-fixture
          path: images/ci-update-riscv64/
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-windows-fixture
          path: ${{ runner.temp }}/k-vm-ci-logs/
          if-no-files-found: ignore
  win32:
    runs-on: windows-latest
    needs: windows-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
      - name: Native Bazel build and tests
        shell: pwsh
        run: |
          python tools/ci_run.py --bazel -- bazel test --config=win32 //...
      - uses: actions/download-artifact@v4
        with:
          name: windows-riscv64-fixture
          path: images/ci-riscv64
      - uses: actions/download-artifact@v4
        with:
          name: windows-update-fixture
          path: images/ci-update-riscv64
      - name: Native guest mappings, networking and terminal
        shell: pwsh
        run: python tools/ci_run.py -- python tests/win32_guest_check.py --binary bazel-bin/k-vm.exe --image images/ci-riscv64
      - name: Native guest transactional updates
        shell: pwsh
        run: python tools/ci_run.py -- python tests/win32_update_check.py --binary bazel-bin/k-vm.exe --image images/ci-update-riscv64
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-win32
          path: ${{ runner.temp }}/k-vm-ci-logs/
          if-no-files-found: ignore
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev e2fsprogs libsdl1.2-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bazelisk openssl@3 e2fsprogs sdl12-compat coreutils
          # Installer regression tests use the same SHA256 utility as the guest.
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
      - name: Install Bazelisk on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test CI failure reporting
        run: python3 tests/ci_run_test.py
      - name: Native build and tests
        run: python3 tools/ci_run.py --bazel -- bazel test --test_env=PATH //...
      - name: Prepare shell fixture
        run: python3 tools/ci_run.py -- python3 tools/prepare_linux_image.py --output images/ci-riscv64
      - name: Guest files, terminal and updates
        run: |
          python3 tools/ci_run.py -- python3 tests/agent_workspace_check.py --image images/ci-riscv64
          python3 tools/ci_run.py -- python3 tests/pi_update_check.py --image images/ci-riscv64
          python3 tools/ci_run.py -- python3 tests/agent_dispatch_check.py --image images/ci-riscv64
      - name: SDL build and tests
        run: python3 tools/ci_run.py --bazel -- bazel test --config=sdl --test_env=PATH //...
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/k-vm-ci-logs/
          if-no-files-found: ignore

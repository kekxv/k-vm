name: Host compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: python3 tools/prepare_linux_image.py --output images/ci-riscv64
      - run: python3 tests/win32_update_check.py --image images/ci-riscv64 --prepare images/ci-update-riscv64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-riscv64-fixture
          path: images/ci-riscv64/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update-fixture
          path: images/ci-update-riscv64/
  win32:
    runs-on: windows-latest
    needs: windows-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - uses: bazel-contrib/setup-bazel@0.14.0
      - name: Native Bazel build and tests
        shell: pwsh
        run: |
          $env:BAZEL_SH = '${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe'
          bazel test --config=win32 //...
      - uses: actions/download-artifact@v4
        with:
          name: windows-riscv64-fixture
          path: images/ci-riscv64
      - uses: actions/download-artifact@v4
        with:
          name: windows-update-fixture
          path: images/ci-update-riscv64
      - name: Build native EXE and run native unit tests
        shell: msys2 {0}
        run: python tools/build_win32.py --test
      - name: Native guest mappings, networking and terminal
        shell: msys2 {0}
        run: python tests/win32_guest_check.py --binary out/win32/k-vm.exe --image images/ci-riscv64
      - name: Native guest transactional updates
        shell: msys2 {0}
        run: python tests/win32_update_check.py --binary out/win32/k-vm.exe --image images/ci-update-riscv64
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev e2fsprogs libsdl1.2-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bazelisk openssl@3 e2fsprogs sdl12-compat
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
          echo "build --copt=-I$(brew --prefix openssl@3)/include" >> .bazelrc
          echo "build --linkopt=-L$(brew --prefix openssl@3)/lib" >> .bazelrc
          echo "build --copt=-I$(brew --prefix sdl12-compat)/include" >> .bazelrc
          echo "build --linkopt=-L$(brew --prefix sdl12-compat)/lib" >> .bazelrc
      - name: Install Bazelisk on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Native build and tests
        run: bazel test //...
      - name: Prepare shell fixture
        run: python3 tools/prepare_linux_image.py --output images/ci-riscv64
      - name: Guest files, terminal and updates
        run: |
          python3 tests/agent_workspace_check.py --image images/ci-riscv64
          python3 tests/pi_update_check.py --image images/ci-riscv64
          python3 tests/agent_dispatch_check.py --image images/ci-riscv64
      - name: SDL build and tests
        run: bazel test --config=sdl //...
